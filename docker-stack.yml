version: "3.8"

services:

  # POSTGRESQL
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER_FILE: /run/secrets/DB_USER_NAME
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
      POSTGRES_DB_FILE: /run/secrets/DB_NAME
    secrets:
      - DB_NAME
      - DB_USER_NAME
      - DB_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/DB_USER_NAME) -d $$(cat /run/secrets/DB_NAME)"]
      interval: 5s
      timeout: 5s
      retries: 10

  # CHARGE PROXY
  charge-proxy:
    image: projeto-dac-charge-proxy:1.9
    ports:
      - "8082:8082"
      - "8089:8089"
    environment:
      USE_SYSTEM_CA_CERTIFICATES: 0
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
    secrets:
      - ASAAS_SANDBOX_API_KEY
      - ASAAS_WEBHOOK_TOKEN
    networks:
      - app-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # CHARGE MANAGER
  charge-manager:
    image: projeto-dac-charge-manager:1.9
    ports:
      - "8085:8085"
      - "8090:8090"
    environment:
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      USE_SYSTEM_CA_CERTIFICATES: 0
      SPRING_CHARGE_PROXY_WSDL_URL: http://charge-proxy:8089/ws/charge?wsdl
    secrets:
      - DB_NAME
      - DB_USER_NAME
      - DB_PASSWORD
    networks:
      - app-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    command: >
      sh -c "
      until pg_isready -h postgres -U $$(cat /run/secrets/DB_USER_NAME) -d $$(cat /run/secrets/DB_NAME); do
        echo 'Aguardando banco...';
        sleep 2;
      done;
      until curl -sf http://charge-proxy:8089/ws/charge?wsdl > /dev/null; do
        echo 'Aguardando Proxy...';
        sleep 2;
      done;
      export DB_NAME=$$(cat /run/secrets/DB_NAME);
      export DB_USER_NAME=$$(cat /run/secrets/DB_USER_NAME);
      export DB_PASSWORD=$$(cat /run/secrets/DB_PASSWORD);
      java -jar /app/charge-manager.jar
      "

volumes:
  postgres_data:

networks:
  app-network:
    driver: overlay

secrets:
  DB_NAME:
    external: true
  DB_USER_NAME:
    external: true
  DB_PASSWORD:
    external: true
  ASAAS_SANDBOX_API_KEY:
    external: true
  ASAAS_WEBHOOK_TOKEN:
    external: true